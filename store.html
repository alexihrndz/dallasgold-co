<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Dallas Gold Colombia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Dallas<span>Gold</span></a>
            <button class="menu-btn" aria-label="Abrir menú">☰</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">Nosotros</a>
                <a href="store.html" class="active">Tienda</a>
                <a href="contact.html">Contacto</a>
            </nav>
        </div>
    </header>

    <div style="height: 80px;"></div> <!-- Spacer for fixed header -->

    <section class="section container">
        <h1 class="section-title">Nuestra Colección</h1>
        
        <!-- Category Filters -->
        <div class="store-filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="anillos">Anillos</button>
            <button class="filter-btn" data-filter="cadenas">Cadenas</button>
            <button class="filter-btn" data-filter="pulseras">Pulseras</button>
            <button class="filter-btn" data-filter="relojes">Relojes</button>
        </div>

        <!-- Store Grid: generado dinámicamente por main.js desde data/products.json -->
        <div class="product-grid" id="store-grid">
            <p class="grid-loading">Cargando colección...</p>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Dallas Gold Colombia. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>
    <script src="js/ImageService.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
