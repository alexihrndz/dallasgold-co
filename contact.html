<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Dallas Gold Colombia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Dallas<span>Gold</span></a>
            <button class="menu-btn" aria-label="Abrir menú">☰</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">Nosotros</a>
                <a href="store.html">Tienda</a>
                <a href="contact.html" class="active">Contacto</a>
            </nav>
        </div>
    </header>

    <div style="height: 80px;"></div>

    <section class="section container">
        <h1 class="section-title">Contáctanos</h1>
        
        <div class="contact-wrapper">
            <!-- Contact Info -->
            <div>
                <h2 style="margin-bottom: 2rem; font-family: var(--font-heading);">Estamos aquí para ayudarte</h2>
                <div class="contact-info-item">
                    <h4>Nuestra Tienda</h4>
                    <p id="contact-address"></p>
                </div>
                <div class="contact-info-item">
                    <h4>Teléfono & WhatsApp</h4>
                    <p><a id="contact-whatsapp" href="#" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;"></a></p>
                </div>
                <div class="contact-info-item">
                    <h4>Email</h4>
                    <p><a id="contact-email" href="#" style="color: inherit; text-decoration: none;"></a></p>
                </div>
                <div class="contact-info-item">
                    <h4>Horarios de Atención</h4>
                    <p id="contact-hours"></p>
                </div>
            </div>

            <!-- Contact Form -->
            <div>
                <form class="contact-form" onsubmit="event.preventDefault(); alert('¡Gracias por tu mensaje! Te contactaremos pronto.');">
                    <div class="form-group">
                        <label for="name" style="display:none;">Nombre</label>
                        <input type="text" id="name" placeholder="Tu Nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="email" style="display:none;">Email</label>
                        <input type="email" id="email" placeholder="Tu Email" required>
                    </div>
                    <div class="form-group">
                        <label for="message" style="display:none;">Mensaje</label>
                        <textarea id="message" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
                    </div>
                    <button type="submit" class="btn">Enviar Mensaje</button>
                </form>
            </div>
        </div>

        <!-- Google Maps Embed -->
        <div class="map-container">
            <iframe 
                id="contact-map"
                src="" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Dallas Gold Colombia. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
